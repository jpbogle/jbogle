const svg = d3.select("#svg-outer")
              .on("click", stopped);

const retiredPages = ["#skills", "#interests", "#projects"];
const mobileLayout = window.matchMedia("screen and (max-width: 700px), screen and (max-height: 500px)");
const mobilePage = document.getElementById("mobile-page");
const menuToggle = document.getElementById("menuToggle");
const hamburger = document.getElementById("hamburger");
var active = d3.select(null);

initLinks();
svg.call(zoom) // delete this line to disable free zooming
   .on("wheel.zoom", null);
const playIntro = shouldPlayIntro();
navigate(false);
if (playIntro) svg.call(zoom.transform, birdsEyeTransform);

document.fonts.ready.then(() => {
  if (!playIntro) return centerActivePage();
  // Leave any navigation, panning, or zooming the visitor has already done alone.
  if (d3.zoomTransform(svg.node()) !== birdsEyeTransform || active.node()?.id !== "home") return;
  if (mobileLayout.matches || reducedMotion.matches) return navigate(false);
  grabbingDisabled = true;
  svg.transition()
      .delay(150)
      .duration(850)
      .call(zoom.transform, getTransformForPage("home"));
});
window.addEventListener("resize", centerActivePage);
window.addEventListener("hashchange", () => navigate());
mobileLayout.addEventListener("change", () => navigate(false));
reducedMotion.addEventListener("change", () => zoom.duration(motionDuration(250)));

// Capture outside presses before the canvas handles dragging.
document.addEventListener("pointerdown", event => {
  if (!menuToggle.contains(event.target)) hamburger.checked = false;
}, true);

document.addEventListener("keydown", event => {
  if (event.key === "Escape" && hamburger.checked) {
    event.preventDefault();
    hamburger.checked = false;
    hamburger.focus({ preventScroll: true });
  }
});

function shouldPlayIntro() {
  if (mobileLayout.matches || reducedMotion.matches) return false;
  if (window.location.hash && window.location.hash !== "#home") return false;
  try {
    if (sessionStorage.getItem("home-intro-seen")) return false;
    sessionStorage.setItem("home-intro-seen", "true");
    return true;
  } catch {
    return false;
  }
}

// Use the URL for initial loads, menu links, and browser Back/Forward.
function navigate(animate = true) {
  let hash = retiredPages.includes(window.location.hash) ? "#about" : window.location.hash;
  if (!pages.some(page => `#${page.id}` === hash)) hash = "#home";
  if (window.location.hash && window.location.hash !== hash) {
    window.history.replaceState(null, "", hash);
  }

  active.classed("active", false);
  active = d3.select(`#menu ${hash}`).classed("active", true);
  hamburger.checked = false;
  grabbingDisabled = true;
  svg.interrupt();
  // Move the existing content; don't maintain a separate mobile copy.
  pages.forEach(page => {
    const parent = mobileLayout.matches && hash === `#${page.id}`
      ? mobilePage : document.getElementById(`${page.id}-outer`);
    if (page.content.parentElement !== parent) parent.appendChild(page.content);
  });
  mobilePage.hidden = !mobileLayout.matches;
  if (mobileLayout.matches) {
    window.scrollTo(0, 0);
    return;
  }
  const target = getTransformForPage(hash.slice(1));
  const view = animate ? svg.transition().duration(motionDuration(700)) : svg;
  view.call(zoom.transform, target);
}

function initLinks() {
  const menu = d3.select("#menu");
  pages.forEach(link => {
    link.content = document.querySelector(`#${link.id}-outer .page-inner`);
    d3.select(`#${link.id}-outer`)
      .attr("x", link.x)
      .attr("y", link.y)
    menu.append("a")
        .attr("href", `#${link.id}`)
        .on("click", clicked)
      .append("li")
        .attr("id", link.id)
        .html(link.title);
  });
  menu.append("input")
    .attr("type", "checkbox")
    .attr("id", "switch")
    .attr("aria-label", "Dark mode")
    .on("click", toggleDarkMode)
  menu.append("label")
    .attr("for", "switch")
}

function getTransformForPage(id) {
  const content = document.querySelector(`#${id}-outer .page-inner`);
  const rects = Array.from(content.children)
    .filter(element => element.getClientRects().length)
    .map(element => element.getBoundingClientRect());
  const left = Math.min(...rects.map(rect => rect.left));
  const right = Math.max(...rects.map(rect => rect.right));
  const top = Math.min(...rects.map(rect => rect.top));
  const bottom = Math.max(...rects.map(rect => rect.bottom));

  // Convert the content's screen position back into canvas coordinates so
  // navigation works from any pan or zoom level, including the overview.
  const screenToCanvas = document.getElementById("view-box").getScreenCTM().inverse();
  const center = new DOMPoint((left + right) / 2, (top + bottom) / 2)
    .matrixTransform(screenToCanvas);
  const viewport = svg.node().viewBox.baseVal;

  return d3.zoomIdentity.translate(
    viewport.x + viewport.width / 2 - center.x,
    viewport.y + viewport.height / 2 - center.y
  );
}

function centerActivePage() {
  if (active.node() && !mobileLayout.matches) navigate(false);
}

function clicked() {
  if (d3.event.ctrlKey || d3.event.metaKey || d3.event.shiftKey || d3.event.altKey) return;
  if (active.node() === this.querySelector("li")) {
    d3.event.preventDefault();
    if (mobileLayout.matches) navigate();
    else reset();
  } else if (this.hash === window.location.hash) {
    // Returning from the overview to the same URL won't fire hashchange.
    navigate();
  }
}

function reset() {
  hamburger.checked = false;
  d3.selectAll("#arrow").remove();
  active.classed("active", false);
  active = d3.select(null);
  svg.transition()
      .duration(motionDuration(500))
      .call(zoom.transform, birdsEyeTransform);
}

// If the drag behavior prevents the default click,
// also stop propagation so we don’t click-to-zoom.
function stopped() {
  if (d3.event.defaultPrevented) d3.event.stopPropagation();
}

function toggleDarkMode() {
   var element = document.body;
   element.classList.toggle("dark-mode");
}

d3.select("#zoom-in").on("click", function() {
  zoom.scaleBy(svg.transition().duration(motionDuration(100)), 1.2);
});

d3.select("#zoom-out").on("click", function() {
  zoom.scaleBy(svg.transition().duration(motionDuration(100)), 0.8);
});

</script>
